; Runs as pwuser (no root needed). Every program logs to the container's stdout,
; so `docker compose logs app` shows everything.

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

; Virtual screen for the headful Chromium. A stale lock from a previous run
; (container restart keeps /tmp) would stop Xvfb from starting, so clear it first.
[program:xvfb]
command=/bin/sh -c "rm -f /tmp/.X99-lock /tmp/.X11-unix/X99; exec Xvfb :99 -screen 0 1280x800x24 -nolisten tcp"
priority=10
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; VNC view of that screen, only on localhost (never exposed outside the container).
[program:x11vnc]
command=x11vnc -display :99 -localhost -rfbport 5900 -shared -forever -nopw -quiet
priority=20
autorestart=true
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; noVNC web client + WebSocket bridge; Fastify proxies /admin/vnc/* here behind the admin login.
[program:websockify]
command=websockify --web /usr/share/novnc 127.0.0.1:6080 127.0.0.1:5900
priority=30
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:app]
command=node server/dist/index.js
directory=/app
priority=40
autorestart=true
startretries=5
stopwaitsecs=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
